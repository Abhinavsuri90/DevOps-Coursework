{
  "apiVersion": "apps/v1",
  "kind": "StatefulSet",
  "metadata": {
    "name": "web-stateful"
  },
  "spec": {
    "serviceName": "web-service-headless",
    "replicas": 3,
    "selector": {
      "matchLabels": {
        "app": "web-headless"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "web-headless"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "nginx",
            "image": "nginx:1.27",
            "ports": [
              {
                "containerPort": 80
              }
            ]
          }
        ]
      }
    }
  }
}
