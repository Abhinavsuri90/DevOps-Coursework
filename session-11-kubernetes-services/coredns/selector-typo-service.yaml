# Troubleshooting drill (adapted from the instructor's empty-endpoints.yaml):
# the selector says "catalogue" but the Pods are labelled app=catalog.
apiVersion: v1
kind: Service
metadata:
  name: catalog-v2
  namespace: shop
spec:
  selector:
    app: catalogue
  ports:
    - name: http
      port: 80
      targetPort: 80
