# Two namespaces, one Service in each, and a client Pod with DNS and HTTP tools.
# Used by fqdn/README.md and coredns/README.md.
apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
apiVersion: v1
kind: Namespace
metadata:
  name: payments
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: shop
spec:
  selector:
    app: catalog
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing
  namespace: payments
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billing
  template:
    metadata:
      labels:
        app: billing
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: billing
  namespace: payments
spec:
  selector:
    app: billing
  ports:
    - name: http
      port: 80
      targetPort: 80
---
# Both containers share the Pod network namespace and /etc/resolv.conf.
apiVersion: v1
kind: Pod
metadata:
  name: netclient
  namespace: shop
spec:
  containers:
    - name: dns
      image: registry.k8s.io/e2e-test-images/jessie-dnsutils:1.3
      command: ["sleep", "infinity"]
    - name: curl
      image: curlimages/curl:8.11.1
      command: ["sleep", "infinity"]
