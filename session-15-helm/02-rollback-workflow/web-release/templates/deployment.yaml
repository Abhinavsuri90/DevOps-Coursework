apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "web-release.fullname" . }}
  labels:
    {{- include "web-release.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "web-release.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "web-release.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the Pods whenever the page content changes.
        checksum/site: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          lifecycle:
            # Give kube-proxy time to drop this Pod from the Service before nginx stops,
            # so rolling upgrades and rollbacks don't cut requests off.
            preStop:
              exec:
                command: ["sleep", "5"]
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
      volumes:
        - name: site
          configMap:
            name: {{ include "web-release.fullname" . }}-site
