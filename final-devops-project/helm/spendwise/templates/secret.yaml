{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "spendwise.db.secretName" . }}
  labels:
    {{- include "spendwise.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ required "set database.password or database.existingSecret" .Values.database.password | quote }}
{{- end }}
