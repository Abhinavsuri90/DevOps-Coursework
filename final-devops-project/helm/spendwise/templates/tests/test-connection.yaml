# `helm test <release>` runs this Pod: it calls the backend health endpoint and the frontend.
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-test
  labels:
    {{- include "spendwise.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    # Keep the Pod after it succeeds so `helm test --logs` can read its logs (the Helm on CI runners
    # failed with hook-succeeded: the Pod was gone before the logs were fetched). Replaced on the next run.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  containers:
    - name: test
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          wget -qO- http://{{ include "spendwise.backend.name" . }}:8000/health &&
          wget -qO- http://{{ include "spendwise.frontend.name" . }}/healthz
