{{- if .Values.ingress.enabled }}
# One entry point: /api goes to the FastAPI backend, everything else to the React frontend.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "spendwise.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: {{ $.Values.ingress.apiPath }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "spendwise.backend.name" $ }}
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "spendwise.frontend.name" $ }}
                port:
                  name: http
    {{- end }}
{{- end }}
