# Minikube with images built locally and loaded with `minikube image load`.
backend:
  image:
    repository: spendwise-backend
    tag: local
  # Minikube runs the whole cluster in about 3.4 GB of memory, so cap autoscaling at 3 Pods.
  autoscaling:
    maxReplicas: 3
frontend:
  image:
    repository: spendwise-frontend
    tag: local
ingress:
  hosts:
    - spendwise.local
monitoring:
  serviceMonitor:
    enabled: true
  rules:
    enabled: true
  dashboard:
    enabled: true
