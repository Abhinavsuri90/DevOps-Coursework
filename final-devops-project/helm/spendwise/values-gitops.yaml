# Values used by Argo CD (GitOps). The CI pipeline rewrites the two image tags below
# after it has pushed new images to GHCR, then commits this file back to main.
backend:
  image:
    repository: ghcr.io/abhinavsuri90/spendwise-backend
    tag: "f63e9a4e2faa"
  # Minikube runs the whole cluster in about 3.4 GB of memory, so cap autoscaling at 3 Pods.
  autoscaling:
    maxReplicas: 3
frontend:
  image:
    repository: ghcr.io/abhinavsuri90/spendwise-frontend
    tag: "f63e9a4e2faa"
ingress:
  hosts:
    - spendwise.local
monitoring:
  serviceMonitor:
    enabled: true
  rules:
    enabled: true
  dashboard:
    enabled: true
