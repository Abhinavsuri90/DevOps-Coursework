# Source: spendwise/templates/prometheusrule.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: spendwise-alerts
  labels:
    app.kubernetes.io/part-of: spendwise
    app.kubernetes.io/instance: spendwise
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: spendwise-1.0.0
spec:
  groups:
    - name: spendwise
      rules:
        - alert: SpendWiseHighErrorRate
          expr: |
            sum(rate(spendwise_http_requests_total{namespace="spendwise",status=~"5.."}[5m]))
              / sum(rate(spendwise_http_requests_total{namespace="spendwise"}[5m])) > 0.05
          for: 2m
          labels:
            severity: warning
            app: spendwise
          annotations:
            summary: More than 5% of SpendWise API requests are failing
        - alert: SpendWiseBackendDown
          expr: sum(up{namespace="spendwise",job="spendwise-backend"}) == 0
          for: 1m
          labels:
            severity: critical
            app: spendwise
          annotations:
            summary: No SpendWise backend Pod can be scraped
        - alert: SpendWiseSlowRequests
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(spendwise_http_request_duration_seconds_bucket{namespace="spendwise"}[5m]))) > 0.5
          for: 5m
          labels:
            severity: warning
            app: spendwise
          annotations:
            summary: SpendWise p95 latency is above 500 ms

