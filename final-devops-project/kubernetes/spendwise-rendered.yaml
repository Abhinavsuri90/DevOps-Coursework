# Source: spendwise/templates/backend.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spendwise-backend
  labels:
    app.kubernetes.io/part-of: spendwise
    app.kubernetes.io/instance: spendwise
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: spendwise-1.0.0
    app.kubernetes.io/name: backend
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: spendwise
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: spendwise
        app.kubernetes.io/instance: spendwise
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: spendwise-1.0.0
        app.kubernetes.io/name: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Wait for PostgreSQL so the first migration doesn't fail and restart the Pod.
        - name: wait-for-db
          image: postgres:17-alpine
          command: ["sh", "-c", "until pg_isready -h \"$DB_HOST\" -p \"$DB_PORT\" -U \"$DB_USER\" -d \"$DB_NAME\"; do echo waiting for database; sleep 2; done"]
          envFrom:
            - configMapRef:
                name: spendwise-config
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: api
          image: spendwise-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: spendwise-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spendwise-db
                  key: password
            # $(VAR) references are expanded by Kubernetes from the variables above.
            - name: DATABASE_URL
              value: postgresql+psycopg://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)
            - name: APP_VERSION
              value: "local"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          # Liveness is deliberately lenient: on a busy node a slow answer is not a dead process,
          # and restarting healthy Pods only adds load (seen on Minikube under CPU pressure).
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

