# Source: spendwise/templates/postgres.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spendwise-postgres
  labels:
    app.kubernetes.io/part-of: spendwise
    app.kubernetes.io/instance: spendwise
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: spendwise-1.0.0
    app.kubernetes.io/name: postgres
spec:
  serviceName: spendwise-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: spendwise
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: spendwise
        app.kubernetes.io/instance: spendwise
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: spendwise-1.0.0
        app.kubernetes.io/name: postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70        # "postgres" user in the Alpine image
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: spendwise-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: spendwise-config
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spendwise-db
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi

---
# Source: spendwise/templates/ingress.yaml
# One entry point: /api goes to the FastAPI backend, everything else to the React frontend.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spendwise
  labels:
    app.kubernetes.io/part-of: spendwise
    app.kubernetes.io/instance: spendwise
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: spendwise-1.0.0
spec:
  ingressClassName: nginx
  rules:
    - host: "spendwise.local"
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: spendwise-backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: spendwise-frontend
                port:
                  name: http

