apiVersion: v1
kind: Pod
metadata:
  name: spendwise-test
  labels:
    app.kubernetes.io/part-of: spendwise
    app.kubernetes.io/instance: spendwise
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: spendwise-1.0.0
  annotations:
