# Shared Trivy policy for the SCA (filesystem) and container image scans.
severity:
  - HIGH
  - CRITICAL
exit-code: 1
scan:
  scanners:
    - vuln
vulnerability:
  # Fail only on vulnerabilities that have a released fix we can upgrade to.
  ignore-unfixed: true
db:
  repository:
    - public.ecr.aws/aquasecurity/trivy-db:2
    - ghcr.io/aquasecurity/trivy-db:2
