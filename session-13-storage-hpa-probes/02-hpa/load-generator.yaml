# In-cluster load generator: each replica runs two request loops against the Service,
# so traffic is spread across all backend Pods by kube-proxy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  labels:
    app: load-generator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: busybox
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              for loop in 1 2; do
                (while true; do wget -q -O /dev/null http://yatri-backend-service/; done) &
              done
              wait
          resources:
            requests:
              cpu: 50m
            limits:
              cpu: 250m
