# yatri-backend: a tiny Python HTTP API whose "/" endpoint does some CPU work per request,
# so an HPA on CPU utilisation has something to react to. "/healthz" stays cheap for probes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: yatri-backend-code
  labels:
    app: yatri-backend
data:
  app.py: |
    import math
    import socket
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path.startswith("/healthz"):
                body = b"ok\n"
            else:
                total = sum(math.sqrt(i) for i in range(1, 40000))
                body = f"yatri-backend {socket.gethostname()} result={total:.0f}\n".encode()
            self.send_response(200)
            self.send_header("Content-Type", "text/plain")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, *args):
            pass

    ThreadingHTTPServer(("", 5000), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yatri-backend
  labels:
    app: yatri-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yatri-backend
  template:
    metadata:
      labels:
        app: yatri-backend
    spec:
      containers:
        - name: api
          image: python:3.12-alpine
          command: ["python", "/app/app.py"]
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 96Mi
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: yatri-backend-code
