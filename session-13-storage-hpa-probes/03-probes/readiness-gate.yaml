# Readiness probe pointed at a path that does not exist: the Pod runs but never becomes Ready,
# so the Service sends it no traffic. (Instructor mini-project, bonus challenge 2.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe-readiness
  labels:
    lab: probes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe-readiness
  template:
    metadata:
      labels:
        app: probe-readiness
        lab: probes
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /does-not-exist
              port: 80
            periodSeconds: 3
            failureThreshold: 1
---
apiVersion: v1
kind: Service
metadata:
  name: probe-readiness
  labels:
    lab: probes
spec:
  selector:
    app: probe-readiness
  ports:
    - port: 80
      targetPort: 80
