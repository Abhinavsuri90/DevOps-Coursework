# emptyDir: scratch space created with the Pod, shared by its containers, deleted with the Pod.
apiVersion: v1
kind: Pod
metadata:
  name: emptydir-demo
  labels:
    lab: volumes
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "while true; do echo \"$(date +%T) written by writer\" >> /cache/log.txt; sleep 5; done"]
      volumeMounts:
        - name: shared-cache
          mountPath: /cache
    - name: reader
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: shared-cache
          mountPath: /cache
          readOnly: true
        - name: ram-scratch
          mountPath: /scratch
  volumes:
    - name: shared-cache
      emptyDir: {}
    - name: ram-scratch
      emptyDir:
        medium: Memory
        sizeLimit: 16Mi
