# Fix: create the missing ConfigMap. The kubelet retries the mount and the Pod starts.
apiVersion: v1
kind: ConfigMap
metadata:
  name: site-config
  labels:
    lab: troubleshooting
data:
  default.conf: |
    server {
      listen 80;
      listen [::]:80;
      location / {
        return 200 "site-config loaded\n";
      }
    }
