# The Pod mounts a ConfigMap that was never created, so the kubelet cannot set up the
# volume and the container stays in ContainerCreating.
apiVersion: v1
kind: Pod
metadata:
  name: stuck-creating
  labels:
    lab: troubleshooting
spec:
  containers:
    - name: nginx
      image: nginx:1.27-alpine
      volumeMounts:
        - name: site-config
          mountPath: /etc/nginx/conf.d
  volumes:
    - name: site-config
      configMap:
        name: site-config
