# Instructor 09-service-dns-troubleshooting/service.yaml: selector app=web-ahsgdf matches no Pod,
# and the targetPort is also wrong (8080 instead of nginx's 80).
apiVersion: v1
kind: Service
metadata:
  name: web-service
  labels:
    lab: troubleshooting
spec:
  type: ClusterIP
  selector:
    app: web-ahsgdf
  ports:
    - port: 80
      targetPort: 8080
