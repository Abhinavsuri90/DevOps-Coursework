{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "lifecycle-multi",
    "labels": {
      "app": "lifecycle-multi"
    }
  },
  "spec": {
    "containers": [
      {
        "name": "app",
        "image": "busybox:1.36",
        "command": [
          "sh",
          "-c",
          "while true; do date >> /logs/app.log; sleep 5; done"
        ],
        "volumeMounts": [
          {
            "name": "logs",
            "mountPath": "/logs"
          }
        ]
      },
      {
        "name": "sidecar",
        "image": "busybox:1.36",
        "command": [
          "sh",
          "-c",
          "touch /logs/app.log; tail -f /logs/app.log"
        ],
        "volumeMounts": [
          {
            "name": "logs",
            "mountPath": "/logs"
          }
        ]
      }
    ],
    "volumes": [
      {
        "name": "logs",
        "emptyDir": {}
      }
    ]
  }
}
