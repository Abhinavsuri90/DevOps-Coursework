{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "lifecycle-startup",
    "labels": {
      "app": "lifecycle-startup"
    }
  },
  "spec": {
    "containers": [
      {
        "name": "app",
        "image": "busybox:1.36",
        "command": [
          "sh",
          "-c",
          "sleep 20; touch /tmp/started; sleep 3600"
        ],
        "startupProbe": {
          "exec": {
            "command": [
              "test",
              "-f",
              "/tmp/started"
            ]
          },
          "periodSeconds": 3,
          "failureThreshold": 10
        },
        "livenessProbe": {
          "exec": {
            "command": [
              "test",
              "-f",
              "/tmp/started"
            ]
          },
          "periodSeconds": 5
        }
      }
    ]
  }
}
