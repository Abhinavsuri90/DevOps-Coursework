{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "lifecycle-liveness",
    "labels": {
      "app": "lifecycle-liveness"
    }
  },
  "spec": {
    "containers": [
      {
        "name": "app",
        "image": "busybox:1.36",
        "command": [
          "sh",
          "-c",
          "sleep 3600"
        ],
        "livenessProbe": {
          "exec": {
            "command": [
              "test",
              "-f",
              "/tmp/never-created"
            ]
          },
          "initialDelaySeconds": 5,
          "periodSeconds": 5,
          "failureThreshold": 2
        }
      }
    ]
  }
}
