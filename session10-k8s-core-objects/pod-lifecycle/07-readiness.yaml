{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "lifecycle-readiness",
    "labels": {
      "app": "lifecycle-readiness"
    }
  },
  "spec": {
    "containers": [
      {
        "name": "app",
        "image": "busybox:1.36",
        "command": [
          "sh",
          "-c",
          "sleep 30; touch /tmp/ready; sleep 3600"
        ],
        "readinessProbe": {
          "exec": {
            "command": [
              "test",
              "-f",
              "/tmp/ready"
            ]
          },
          "periodSeconds": 3
        }
      }
    ]
  }
}
