{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "blue-green"
  },
  "spec": {
    "type": "ClusterIP",
    "selector": {
      "app": "blue-green",
      "slot": "green"
    },
    "ports": [
      {
        "name": "http",
        "port": 80,
        "targetPort": 5678
      }
    ]
  }
}
