{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "troubleshoot-image"
  },
  "spec": {
    "replicas": 3,
    "selector": {
      "matchLabels": {
        "app": "troubleshoot-image"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "troubleshoot-image"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "app",
            "image": "registry.invalid/coursework/no-image:missing",
            "args": [
              "-listen=:5678",
              "-text=v1"
            ],
            "ports": [
              {
                "containerPort": 5678
              }
            ]
          }
        ]
      }
    }
  }
}
