# Session 16 - Continuous Delivery: runs after CI succeeds on main.
# Publishes the image to GitHub Container Registry and deploys it to a "staging" environment.
# A copy lives in session-16-github-actions/workflows/.
name: "Session 16 · CD"

on:
  workflow_run:
    workflows: ["Session 16 · CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish image to GHCR
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Image name
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          {
            echo "image=ghcr.io/${owner}/gpa-calculator:${sha::12}"
            echo "latest=ghcr.io/${owner}/gpa-calculator:latest"
            echo "version=${sha::12}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR with GITHUB_TOKEN
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: session-16-github-actions
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Session 16 GPA Calculator API

  deploy-staging:
    name: Deploy to staging
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start the released image
        run: docker run -d --name gpa-staging -p 8000:8000 ${{ needs.publish.outputs.image }}
      - name: Smoke test the deployment
        run: |
          for _ in $(seq 1 20); do curl -fs http://localhost:8000/health && break; sleep 1; done
          echo
          result=$(curl -fs -X POST http://localhost:8000/api/gpa -H 'Content-Type: application/json' \
            -d '{"courses":[{"credits":4,"grade":"A"},{"credits":4,"grade":"B"}]}')
          echo "$result"
          echo "$result" | grep -q '"gpa":3.5'
      - name: Deployment summary
        run: |
          {
            echo "### Staging deployment"
            echo "- Image: \`${{ needs.publish.outputs.image }}\`"
            echo "- Health: \`$(curl -fs http://localhost:8000/health)\`"
          } >> "$GITHUB_STEP_SUMMARY"
