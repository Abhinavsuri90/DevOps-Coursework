{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "config-demo"
  },
  "spec": {
    "containers": [
      {
        "name": "app",
        "image": "busybox:1.36",
        "env": [
          {
            "name": "APP_MODE",
            "valueFrom": {
              "configMapKeyRef": {
                "name": "app-config",
                "key": "APP_MODE"
              }
            }
          },
          {
            "name": "APP_MESSAGE",
            "valueFrom": {
              "configMapKeyRef": {
                "name": "app-config",
                "key": "APP_MESSAGE"
              }
            }
          }
        ],
        "command": [
          "sh",
          "-c",
          "echo \"$APP_MODE: $APP_MESSAGE\"; sleep 36000"
        ]
      }
    ]
  }
}
