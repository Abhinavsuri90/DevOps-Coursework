apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  labels:
    lab: ingress-controller
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
        lab: ingress-controller
    spec:
      containers:
        - name: http-echo
          image: hashicorp/http-echo:1.0
          args: ["-listen=:5678", "-text=hello from behind the ingress controller"]
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: hello
  labels:
    lab: ingress-controller
spec:
  selector:
    app: hello
  ports:
    - name: http
      port: 80
      targetPort: 5678
