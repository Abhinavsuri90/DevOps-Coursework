{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "secret-demo"
  },
  "spec": {
    "containers": [
      {
        "name": "app",
        "image": "busybox:1.36",
        "command": [
          "sh",
          "-c",
          "test -n \"$DB_PASSWORD\" && echo \"secret is present\"; sleep 36000"
        ],
        "env": [
          {
            "name": "DB_USERNAME",
            "valueFrom": {
              "secretKeyRef": {
                "name": "db-secret",
                "key": "username"
              }
            }
          },
          {
            "name": "DB_PASSWORD",
            "valueFrom": {
              "secretKeyRef": {
                "name": "db-secret",
                "key": "password"
              }
            }
          }
        ]
      }
    ]
  }
}
