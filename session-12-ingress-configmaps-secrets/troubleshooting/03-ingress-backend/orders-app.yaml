apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  labels:
    lab: ingress-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
        lab: ingress-backend
    spec:
      containers:
        - name: http-echo
          image: hashicorp/http-echo:1.0
          args: ["-listen=:5678", "-text=orders service OK"]
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  labels:
    lab: ingress-backend
spec:
  selector:
    app: orders
  ports:
    - name: http
      port: 80
      targetPort: 5678
