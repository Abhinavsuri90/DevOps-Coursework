# FIX: the backend names the real Service and its port.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orders-ingress
  labels:
    lab: ingress-backend
spec:
  ingressClassName: nginx
  rules:
    - host: orders.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: orders
                port:
                  number: 80
