{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "yatri-frontend",
    "labels": {
      "app": "yatri-app"
    }
  },
  "spec": {
    "replicas": 2,
    "selector": {
      "matchLabels": {
        "app": "yatri-frontend"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "yatri-frontend"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "frontend",
            "image": "nginx:1.27",
            "ports": [
              {
                "containerPort": 80
              }
            ],
            "readinessProbe": {
              "httpGet": {
                "path": "/",
                "port": 80
              },
              "initialDelaySeconds": 2,
              "periodSeconds": 5
            }
          }
        ]
      }
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "yatri-frontend",
    "labels": {
      "app": "yatri-app"
    }
  },
  "spec": {
    "type": "ClusterIP",
    "selector": {
      "app": "yatri-frontend"
    },
    "ports": [
      {
        "name": "http",
        "port": 80,
        "targetPort": 80
      }
    ]
  }
}
