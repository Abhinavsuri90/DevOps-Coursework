# Trivy settings shared by the SCA (filesystem) and container image scans.
severity:
  - HIGH
  - CRITICAL
exit-code: 1
scan:
  scanners:
    - vuln
vulnerability:
  # Only fail on problems that have a released fix we could upgrade to.
  ignore-unfixed: true
db:
  repository:
    - public.ecr.aws/aquasecurity/trivy-db:2
    - ghcr.io/aquasecurity/trivy-db:2
